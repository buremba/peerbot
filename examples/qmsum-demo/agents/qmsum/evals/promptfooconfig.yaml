# QMSum agent evals — uses promptfoo via @lobu/promptfoo-provider.
#
# Quick start:
#   bun run scripts/prepare-fixtures.ts       # build .eval-fixtures/*.jsonl from QMSum
#   export LOBU_TOKEN=$(lobu token)           # mint a token after `lobu apply`
#   bun run evals                             # promptfoo eval against this config
#   bun run evals:view                        # open the comparison grid
#
# Test fixtures (.eval-fixtures/*.jsonl) hold QMSum gold answers + spans. They
# are gitignored and MUST NOT be applied to the agent's memory — keeps the
# agent honest.

description: QMSum query Q&A against a Lobu agent

providers:
  - id: '@lobu/promptfoo-provider'
    config:
      agent: qmsum
      # gateway: http://localhost:8787      # default; override via LOBU_GATEWAY
      # token: ...                          # required via LOBU_TOKEN env

defaultTest:
  options:
    provider: anthropic:messages:claude-haiku-4-5-20251001

prompts:
  - '{{query}}'

scenarios:

  - description: Answer quality vs QMSum specific-query gold
    tests: file://../../../.eval-fixtures/specific.jsonl
    config:
      assert:
        - type: llm-rubric
          value: |
            The agent's output should be factually consistent with the gold answer below.
            Score 1.0 if all key facts are conveyed (paraphrasing is fine).
            Score 0.5 if partial — some facts present, others missing or incorrect.
            Score 0 if contradictory or entirely unrelated.

            Gold answer:
            ---
            {{gold_answer}}
            ---

  - description: Meeting summary vs QMSum general_query gold
    tests: file://../../../.eval-fixtures/general.jsonl
    config:
      assert:
        - type: llm-rubric
          value: |
            The agent's output is a summary of meeting {{meeting_id}}.
            Score 1.0 if it covers the major topics/decisions in the gold summary below.
            Score 0.5 if it covers half the topics. Score 0 if it covers none or is contradictory.

            Gold summary:
            ---
            {{gold_answer}}
            ---

  - description: Speaker attribution
    tests: file://../../../.eval-fixtures/attribution.jsonl
    config:
      assert:
        - type: contains
          value: '{{expected_speaker}}'

  - description: Cross-meeting synthesis (hand-authored)
    tests: file://../../../.eval-fixtures/cross-meeting.jsonl
    config:
      assert:
        - type: llm-rubric
          value: |
            The agent should synthesize across at least {{expected_meeting_count}} meetings
            and cite distinct meeting IDs from this list: {{related_meetings}}.
            Score 1.0 if it cites the expected number of distinct meeting IDs and
            substantively connects them. Score 0.5 if it cites them but doesn't synthesize.
            Score 0 if it only references one meeting or none.

