{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: peerbot-loki-datasource
  namespace: {{ .Values.grafana.namespace | default "monitoring" }}
  labels:
    {{- include "peerbot.labels" . | nindent 4 }}
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        url: {{ .Values.grafana.lokiUrl | default "http://loki:3100" }}
        access: proxy
        isDefault: false
        jsonData:
          maxLines: 1000
{{- end }}
