# lobu.toml — Starter agent
# The minimal config to get a proactive agent running with watchers and reactions.
#
# Project structure:
#   lobu.toml                          ← you are here
#   models/
#     schema.yaml                      ← entities, relationships, watchers
#     reactions/
#       daily-summary.reaction.ts      ← reaction script (runs after watcher extracts)
#   agents/
#     starter/
#       prompt.md                      ← agent system prompt

[agents.starter]
name = "starter"
description = "A minimal starter agent that summarizes new events"
dir = "./agents/starter"

[[agents.starter.providers]]
id = "anthropic"
model = "claude/sonnet-4-5"
key = "$ANTHROPIC_API_KEY"

[memory]
enabled = true
org = "starter"
name = "Starter"
description = "Minimal starter project"
models = "./models"
data = "./data"
