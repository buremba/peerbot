name: pi-review

# Shadow-mode AI code review by `pi` (Mario Zechner's pi-coding-agent),
# running with the operator's local ChatGPT-Codex auth state restored from
# the PI_AUTH_BUNDLE secret. Defaults baked into the bundled settings.json
# select openai-codex-3 (gpt-5.5 + thinking=high).
#
# Posts a JSON verdict per docs/REVIEW_SCHEMA.md as a check-run.
# Always conclusion=neutral; never gates merges.
#
# `pull_request` (not `pull_request_target`): fork PRs MUST NOT see the
# bundle — they execute the head ref unprivileged with no secrets.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  pi-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Restore pi auth bundle
        env:
          PI_AUTH_BUNDLE: ${{ secrets.PI_AUTH_BUNDLE }}
        run: |
          if [ -z "${PI_AUTH_BUNDLE:-}" ]; then
            echo "::error::PI_AUTH_BUNDLE secret is empty. Generate it locally with:"
            echo "::error::  tar -czf - -C ~/.pi/agent auth.json chatgpt-accounts.json models.json settings.json extensions git | base64 | pbcopy"
            echo "::error::and add the result as the PI_AUTH_BUNDLE repo secret."
            exit 1
          fi
          mkdir -p ~/.pi/agent
          printf '%s' "$PI_AUTH_BUNDLE" | base64 -d | tar -xzf - -C ~/.pi/agent/

      - name: Install pi + verify extensions
        run: |
          bun add -g @mariozechner/pi-coding-agent
          pi list || true

      - name: Run pi review
        id: review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          VERDICT="$(./scripts/run-pi-review.sh "$PR")"
          echo "$VERDICT" > /tmp/verdict.json
          jq -r '"confidence=\(.confidence) bugs=\(.bugs) slop=\(.slop) blockers=\(.blockers|length)"' /tmp/verdict.json

      - name: Post check-run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -s /tmp/verdict.json ]; then
            HEADLINE="$(jq -r '"confidence \(.confidence), bugs \(.bugs), slop \(.slop), blockers \(.blockers|length)"' /tmp/verdict.json)"
            PRETTY="$(jq . /tmp/verdict.json)"
            SUMMARY="$(printf '%s\n\n```json\n%s\n```\n\n_Shadow mode — verdict does not gate merges. See `docs/REVIEW_SCHEMA.md`._' "$HEADLINE" "$PRETTY")"
            TITLE="pi: $HEADLINE"
          else
            SUMMARY="pi-review failed to produce a verdict. See workflow logs."
            TITLE="pi: error"
          fi
          jq -n \
            --arg name "pi-review" \
            --arg head_sha "$HEAD_SHA" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name:$name, head_sha:$head_sha, status:"completed", conclusion:"neutral", output:{title:$title, summary:$summary}}' \
            > /tmp/check-run.json
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/check-runs" \
            --input /tmp/check-run.json
