name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build core package first
        run: cd packages/core && bun run build

      - name: Run tests with coverage
        run: |
          # Run core, gateway, and cli tests fully
          bun test packages/core packages/gateway packages/cli --coverage
          # Worker tests that don't transitively load pi-coding-agent runtime (WASM unavailable on CI)
          bun test packages/worker/src/__tests__/embedded-tools.test.ts packages/worker/src/__tests__/model-resolver.test.ts packages/worker/src/__tests__/tool-policy.test.ts packages/worker/src/__tests__/processor.test.ts packages/worker/src/__tests__/audio-provider-suggestions.test.ts packages/worker/src/__tests__/generated-media.test.ts packages/worker/src/__tests__/tool-implementations.test.ts packages/worker/src/__tests__/instructions.test.ts packages/worker/src/__tests__/custom-tools.test.ts

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  format-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Run biome format check
        run: bun run format:check
      
      - name: Run biome lint check
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Build core package first
        run: cd packages/core && bun run build

      - name: Run TypeScript type check
        run: bun run typecheck

  smoke-example:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test, format-lint, typecheck]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Require OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret is not configured"
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      - name: Build CLI
        run: |
          cd packages/core && bun run build
          cd ../cli && bun run build

      - name: Build local gateway image
        run: docker build -f docker/Dockerfile.gateway -t lobu-gateway:ci .

      - name: Select healthy free OpenRouter model
        run: |
          OPENROUTER_SELECTOR_VERBOSE=1 \
          bun scripts/select-openrouter-model.mjs --write "$RUNNER_TEMP/openrouter.env"
          cat "$RUNNER_TEMP/openrouter.env"

      - name: Swap example provider to OpenRouter
        working-directory: examples/careops
        run: |
          set -a; source "$RUNNER_TEMP/openrouter.env"; set +a
          python3 - <<'PY'
          from pathlib import Path
          import os
          path = Path('lobu.toml')
          text = path.read_text()
          target = (
              '[[agents.careops.providers]]\n'
              'id = "z-ai"\n'
              'model = "z-ai/glm-4.7"\n'
              'key = "$Z_AI_API_KEY"'
          )
          replacement = (
              '[[agents.careops.providers]]\n'
              'id = "openrouter"\n'
              f'model = "{os.environ["OPENROUTER_MODEL_REF"]}"\n'
              'key = "$OPENROUTER_API_KEY"'
          )
          if target not in text:
              raise SystemExit(f"Expected z-ai provider block not found in {path}")
          path.write_text(text.replace(target, replacement, 1))
          PY

      - name: Create .env for example
        working-directory: examples/careops
        run: |
          cat > .env <<EOF
          ADMIN_PASSWORD=ci-eval-password
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          GATEWAY_PORT=8081
          OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
          EOF

      - name: Start stack
        working-directory: examples/careops
        run: |
          mkdir -p data && chmod 777 data
          # Override: use the gateway image built from this checkout, tame
          # Redis for ephemeral CI, and pass OPENROUTER_API_KEY into the
          # gateway container (base compose only threads Z_AI_API_KEY).
          cat > docker-compose.override.yml <<'YAML'
          services:
            redis:
              command: redis-server --maxmemory 256mb --maxmemory-policy noeviction --save "" --stop-writes-on-bgsave-error no --dir /tmp
            gateway:
              image: lobu-gateway:ci
              pull_policy: never
              environment:
                OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
          YAML
          docker compose up -d
          echo "Waiting for gateway to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null 2>&1; then
              echo "Gateway is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Gateway failed to start"
              docker compose logs gateway
              exit 1
            fi
            sleep 2
          done

      - name: Run all evals with local CLI
        working-directory: examples/careops
        env:
          ADMIN_PASSWORD: ci-eval-password
        run: node ../../packages/cli/bin/lobu.js eval --ci --output eval-results.json

      - name: Gateway logs
        if: always()
        working-directory: examples/careops
        run: docker compose logs gateway 2>&1 | tail -100

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-results-careops
          path: |
            examples/careops/eval-results.json
            examples/careops/agents/*/evals/evals-report.md

      - name: Print eval report
        if: always()
        working-directory: examples/careops
        run: |
          for report in agents/*/evals/evals-report.md; do
            if [ -f "$report" ]; then
              echo "## Eval Report: $report"
              cat "$report"
            fi
          done

      - name: Stop stack
        if: always()
        working-directory: examples/careops
        run: docker compose down
