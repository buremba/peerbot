[agents.qmsum]
name = "qmsum"
description = "Demo agent that answers questions grounded in QMSum meeting transcripts (Yale-LILY query-based meeting summarization dataset)."
dir = "./agents/qmsum"

[[agents.qmsum.providers]]
id = "anthropic"
model = "claude-sonnet-4-6"
key = "$ANTHROPIC_API_KEY"

[agents.qmsum.network]
allowed = [
  "api.anthropic.com",
]

[memory]
enabled = true
org = "qmsum-demo"
name = "QMSum Demo"
description = "Meeting transcripts from the QMSum dataset (Academic, Product, Committee domains) plus speakers and topics."
models = "./models"
data = "./data"
connectors = "./connectors"
