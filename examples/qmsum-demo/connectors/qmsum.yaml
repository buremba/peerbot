# QMSum meeting transcripts — backed by the custom qmsum.connector.ts.
#
# Data is the Yale-LILY QMSum repo's `data/` directory. Get it with:
#   git clone https://github.com/Yale-LILY/QMSum.git data/qmsum
#
# `per_domain_limit: 10` keeps the demo small (10 meetings/domain = 30 total)
# so initial ingest is minutes, not an hour. Drop the cap to ingest everything.
---
version: 1
type: connection
slug: qmsum-transcripts
connector: qmsum
name: QMSum meeting transcripts
config:
  data_dir: "./data/qmsum/data"
  per_domain_limit: 10
feeds:
  - feed: transcripts
    name: Meeting transcripts
    schedule: "@once"
    config:
      data_dir: "./data/qmsum/data"
      per_domain_limit: 10
