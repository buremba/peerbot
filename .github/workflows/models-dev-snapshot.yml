name: Refresh models.dev snapshot

# Regenerates config/models-dev-snapshot.json from https://models.dev/api.json
# (MIT, maintained by sst) and opens a PR when the model data changed.
#
# Why this exists: the snapshot is a BUILD ARTIFACT, not a live fetch — the
# model picker has to work offline, air-gapped, and on a cold boot with no
# egress. Nothing else refreshes it, so without this job it silently rots, which
# is the exact failure the snapshot replaced (a hand-maintained Claude list that
# still named claude-opus-4-8 as the flagship days after claude-opus-5 shipped).
#
# Why a PR and never a direct push to main: this is community-maintained
# upstream data. A provider key renamed or a batch of entries dropped upstream
# would land unreviewed. The generator already hard-fails on a `modelsDevId`
# that stops resolving, but a silently-shrunk model list is not an error — it
# needs eyes.
#
# A no-change week opens NO PR. The generator is deterministic (providers in
# providers.json order, models sorted newest-first, ties broken on id) and
# preserves the previous `generatedAt` stamp when only the date would move, so
# an unchanged upstream produces a byte-identical file and the job exits clean.
# That property is what makes a weekly cadence tolerable rather than noise.
#
# NOTE: the snapshot populates SUGGESTIONS, not permissions — the model picker
# has a freeform escape hatch and ref validation never checks model existence.
# A stale week is therefore a UX papercut, never a block.

on:
  schedule:
    # Mondays 07:00 UTC — an hour after the live-providers job, so the two
    # weekly provider jobs don't contend, and low-traffic either way.
    - cron: "0 7 * * 1"
  # Manual trigger for the day a model ships and you don't want to wait a week.
  workflow_dispatch: {}

# Never let a scheduled run race a manual one; the later one wins.
concurrency:
  group: models-dev-snapshot
  cancel-in-progress: true

# Needs write access to push the refresh branch and open its PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Matches the other workflows; the generator itself doesn't touch owletto,
      # but `bun install` resolves the full workspace.
      - uses: ./.github/actions/setup-submodule
        with:
          deploy-key: ${{ secrets.OWLETTO_WEB_DEPLOY_KEY }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Regenerate snapshot
        run: bun run scripts/gen-models-dev-snapshot.ts

      # The coverage guard re-runs here so a provider key RENAMED upstream fails
      # the job loudly instead of opening a PR that quietly empties a picker.
      - name: Validate mapping coverage
        run: bun scripts/check-models-dev-coverage.ts

      - name: Open PR if the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet -- config/models-dev-snapshot.json; then
            echo "models.dev snapshot unchanged — no PR."
            exit 0
          fi

          echo "Snapshot changed:"
          git diff --stat -- config/models-dev-snapshot.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="chore/models-dev-snapshot-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          # Stage by explicit path: the generator only writes this one file, and
          # a whole-tree add would sweep in anything `bun install` touched.
          git add -- config/models-dev-snapshot.json
          git commit -m "chore: refresh models.dev snapshot"
          git push -u origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: refresh models.dev snapshot" \
            --body "$(cat <<'BODY'
          Regenerated by the weekly `models-dev-snapshot` workflow from
          [models.dev](https://models.dev/api.json) (MIT).

          This is community-maintained upstream data, so please skim the diff
          rather than rubber-stamping it. Worth a look:

          - **Models disappearing.** New entries are routine; a provider losing
            most of its list usually means an upstream restructure, not a real
            deprecation.
          - **Cost or context limits moving sharply.** These render as hints in
            the model picker.
          - **`joinedFrom` changing.** A different join key means a provider was
            renamed upstream; confirm it points at the intended vendor.

          The snapshot only populates model SUGGESTIONS — the picker keeps its
          freeform entry escape hatch and ref validation never checks model
          existence, so nothing here can block a user from running a model.
          BODY
          )"
